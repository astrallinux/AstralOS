modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:       packagechooser
  module:   packagechooser
  config:   packagechooser.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services
  - packages
  - packagechooser
  - initramfs
  - grubcfg
  - bootloader
  - umount
- show:
  - finished
