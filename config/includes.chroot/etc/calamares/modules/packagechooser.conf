mode: required
method: packages

labels:
    step: "Desktop Environment"

items:
    - id: "sway"
      packages: [ sway, swaybg, swaylock, swayidle ]
      name: "Sway"
      description: "A stable, tiling Wayland compositor."
    - id: "mangowm"
      packages: [ mangowm ]
      name: "MangoWM"
      description: "A dynamic, scrolling Wayland compositor."
    - id: "niri"
      packages: [ niri ]
      name: "Niri"
      description: "A modern, Rust-based scrolling Wayland compositor."
    - id: "gnome"
      packages: [ gnome, gnome-shell, gnome-terminal, gdm3 ]
      name: "GNOME"
      description: "A modern, touch-friendly desktop environment."
    - id: "kde"
      packages: [ kde-plasma-desktop, sddm, konsole ]
      name: "KDE Plasma"
      description: "A highly customizable, feature-rich desktop."
    - id: "i3wm"
      packages: [ i3, i3status, i3lock, dmenu, xorg, sddm ]
      name: "i3wm"
      description: "A highly configurable X11 tiling window manager."
